<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/y-y-paraguas-design-system-042bd68c-c9fa-42fa-a7a5-22055de689a4/styles.css">
<script src="_ds/y-y-paraguas-design-system-042bd68c-c9fa-42fa-a7a5-22055de689a4/_ds_bundle.js"></script>
<style>
@keyframes lp-scroll { 0%,10% { transform: translateY(0) } 90%,100% { transform: translateY(-38%) } }
</style>
</helmet>
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:{{ bg }};border-radius:inherit">
  <div style="position:absolute;inset:0;opacity:.22;animation:lp-scroll 12s ease-in-out infinite alternate">
    <div style="display:flex;flex-direction:column;gap:8px;padding:12px">
      <div style="height:7px;width:78%;border-radius:2px;background:{{ ink }}"></div>
      <div style="height:7px;width:52%;border-radius:2px;background:{{ ink }}"></div>
      <div style="height:3px;width:66%;border-radius:2px;background:{{ ink }};margin-top:4px"></div>
      <div style="height:3px;width:58%;border-radius:2px;background:{{ ink }}"></div>
      <div style="height:16px;width:64px;border-radius:999px;border:1px solid {{ ink }};margin-top:6px"></div>
      <div style="height:58px;border-radius:6px;border:1px solid {{ ink }};margin-top:8px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px">
        <div style="height:30px;border-radius:6px;border:1px solid {{ ink }}"></div>
        <div style="height:30px;border-radius:6px;border:1px solid {{ ink }}"></div>
        <div style="height:30px;border-radius:6px;border:1px solid {{ ink }}"></div>
      </div>
      <div style="height:3px;width:70%;border-radius:2px;background:{{ ink }};margin-top:10px"></div>
      <div style="height:3px;width:44%;border-radius:2px;background:{{ ink }}"></div>
      <div style="height:26px;border-radius:999px;background:{{ ink }};margin-top:10px;opacity:.5"></div>
    </div>
  </div>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
    <span style="font-family:var(--font-body);font-weight:900;letter-spacing:-0.02em;font-size:{{ size }};line-height:1;color:{{ ink }}">{{ initial }}</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:300},&quot;bg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;var(--gradient-shard)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#000000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#000000&quot;,&quot;#FFFFFF&quot;,&quot;#FFDD00&quot;]},&quot;initial&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Y&amp;Y&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const initial = this.props.initial ?? "Y&Y";
    return {
      bg: this.props.bg ?? "var(--gradient-shard)",
      ink: this.props.ink ?? "var(--y-black)",
      initial,
      size: this.props.size ?? (String(initial).length > 1 ? "30px" : "46px"),
    };
  }
}

</script>
</body>
</html>
